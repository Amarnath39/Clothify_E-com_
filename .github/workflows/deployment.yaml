name: VPS Deployment
on:
  push:
    branches:
      - main
jobs:
  get_commit_hash:
    runs-on: self-hosted
    name: get_commit_hash
    outputs:
      commitHash: ${{ steps.create_commit_hash.outputs.SHORT_COMMIT_HASH }}
    steps:
      - name: Get short commit hash
        id: create_commit_hash
        run: echo "SHORT_COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Show commit hash
        run: echo "Short commit hash is ${{ steps.create_commit_hash.outputs.SHORT_COMMIT_HASH }}"
  docker_build:
    runs-on: self-hosted
    name: docker_build
    needs:
      - get_commit_hash
    outputs:
      imageTag: ${{ steps.get_docker_image_tag.outputs.DOCKER_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: weteams/${{ secrets.DOCKER_IMAGE_NAME }}:commit_${{needs.get_commit_hash.outputs.commitHash}}
      - name: Get docker image tag
        id: get_docker_image_tag
        run: echo "DOCKER_IMAGE_TAG=commit_${{needs.get_commit_hash.outputs.commitHash}}" >> $GITHUB_OUTPUT
  deploy:
    runs-on: self-hosted
    name: Continuous Deployment
    needs:
      - docker_build
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            IFS=',' read -ra PROJECTS <<< "${{ vars.PROJECT_NAMES }}"
            for PROJECT_NAME in "${PROJECTS[@]}"; do
              cd /root/$PROJECT_NAME/
              docker compose down
              IMAGE_NAME="weteams/${{ secrets.DOCKER_IMAGE_NAME }}"
              IMAGE_TAG="${{ needs.docker_build.outputs.imageTag }}"
              sed -i -E "s|${IMAGE_NAME}:[^\"']*|${IMAGE_NAME}:${IMAGE_TAG}|g" docker-compose.yaml
              docker compose up -d
            done
            cd /root/proxy
            docker compose down proxy
            docker compose up -d proxy
            docker image prune -a -f