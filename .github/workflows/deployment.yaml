name: VPS Deployment
on:
  push:
    branches:
      - main
jobs:
  get_commit_hash:
    runs-on: self-hosted
    name: get_commit_hash
    outputs:
      commitHash: ${{ steps.create_commit_hash.outputs.SHORT_COMMIT_HASH }}
    steps:
      - name: Get short commit hash
        id: create_commit_hash
        run: echo "SHORT_COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Show commit hash
        run: echo "Short commit hash is ${{ steps.create_commit_hash.outputs.SHORT_COMMIT_HASH }}"

  docker_build:
    runs-on: self-hosted
    name: docker_build
    needs:
      - get_commit_hash
    outputs:
      imageTag: ${{ steps.image_outputs.outputs.DOCKER_IMAGE_TAG }}
      imageName: ${{ steps.image_outputs.outputs.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Normalize Image Data
        id: image_outputs
        run: |
          # Robust Lowercase Conversion for Image Name
          RAW_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
          LOWER_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE_NAME="weteams/${LOWER_NAME}"
          COMMIT_TAG="commit_${{needs.get_commit_hash.outputs.commitHash}}"
          
          echo "IMAGE_NAME=${FULL_IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "DOCKER_IMAGE_TAG=${COMMIT_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_outputs.outputs.IMAGE_NAME }}:${{ steps.image_outputs.outputs.DOCKER_IMAGE_TAG }}
          provenance: false # Fixes 400 Bad Request on Docker Hub

  deploy:
    runs-on: self-hosted
    name: Continuous Deployment
    needs:
      - docker_build
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # Authenticate with Normalized Credentials
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            
            # Variables
            # Reconstruct Image Name directly to avoid empty output issues
            RAW_NAME="${{ secrets.DOCKER_IMAGE_NAME }}"
            LOWER_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
            NEW_IMAGE_NAME="weteams/${LOWER_NAME}"
            
            NEW_IMAGE_TAG="${{ needs.docker_build.outputs.imageTag }}"
            
            echo "Target Image: ${NEW_IMAGE_NAME}:${NEW_IMAGE_TAG}"
            
            # Search pattern uses original secret to match existing file content
            SEARCH_IMAGE_PREFIX="weteams/${{ secrets.DOCKER_IMAGE_NAME }}"
            
            IFS=',' read -ra PROJECTS <<< "${{ vars.PROJECT_NAMES }}"
            
            for PROJECT_NAME in "${PROJECTS[@]}"; do
              echo "Deploying to $PROJECT_NAME..."
              cd /root/$PROJECT_NAME/ || continue
              
              # docker compose down || true  <-- Removed to prevent full downtime
              
              # Update docker-compose.yaml with normalized image name and new tag
              sed -i -E "s|${SEARCH_IMAGE_PREFIX}:[^\"']*|${NEW_IMAGE_NAME}:${NEW_IMAGE_TAG}|g" docker-compose.yaml
              
              # Pull new image first to minimize switch-over time
              docker compose pull
              
              # Rolling update: Recreates only changed containers
              docker compose up -d --remove-orphans
            done
            
            # Proxy Refresh
            cd /root/proxy
            # Only recreate proxy if necessary, don't force restart
            docker compose up -d proxy
            
            # Cleanup
            docker image prune -a -f